<!DOCTYPE html>
<html>
<head>
    <title>My First Web Page</title>
</head>
<body>
    <!-- Heading examples -->
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>

    <!-- Paragraph example -->
    <p>This is my first paragraph of text.</p>

    <!-- Line break example -->
    <p>
        This is a sentence.<br>
        This is on the next line.<br><br>
        Notice the extra blank line above.
    </p>

    <!-- Comment example -->
    <!-- This is a comment: it will not show in the browser -->

    <!-- Spaces example -->
    <p>
        This&nbsp;&nbsp;&nbsp;sentence&nbsp;&nbsp;&nbsp;has&nbsp;&nbsp;&nbsp;extra&nbsp;&nbsp;&nbsp;spaces.
    </p>

    <!-- Image example -->
    <h2>Sample Image</h2>
    <img src="https://via.placeholder.com/150" alt="Placeholder Image">

    <!-- Link example -->
    <h2>External Link</h2>
    <p>Visit <a href="https://www.w3schools.com/html/">W3Schools HTML Tutorial</a> for more practice.</p>
</body>
</html>
